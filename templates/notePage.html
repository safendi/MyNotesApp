<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ note }}</title>

<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nerko+One&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: "Nerko One", cursive;
    background: linear-gradient(135deg, #2f2f2f, #1e1e1e);
    color: white;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
}

.container {
    width: 100%;
    max-width: 900px;
}

h1, h2 {
    margin: 10px 0;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

button {
    background: cornflowerblue;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    margin: 6px 0;
    cursor: pointer;
    transition: 0.2s ease;
}

button:hover {
    background: white;
    color: black;
}

#editor {
    background: white;
    color: black;
    border-radius: 10px;
    margin-top: 20px;
}

.section {
    margin-top: 30px;
}

.quizAnswerChoice {
    display: block;
    width: 100%;
    margin: 6px 0;
    background: sandybrown;
}

.correct { background: green !important; }
.incorrect { background: crimson !important; }

</style>
</head>

<body>
<div class="container">

<div class="header">
    <div>
        <h2>{{ className }}</h2>
        <h1>{{ note }}</h1>
    </div>
    <button onclick="goBack()">← Back</button>
</div>

<div id="editor"></div>

<div class="section">
    <button onclick="saveNote()">Save</button>
    <button onclick="generateQuiz()">Generate Quiz (AI)</button>
</div>

<div class="section" id="quizContents"></div>

</div>

<script>

let quill;

document.addEventListener("DOMContentLoaded", async () => {
    quill = new Quill('#editor', { theme: 'snow' });
    await loadNote();
});

function goBack() {
    window.location.href = "/home";
}

async function loadNote() {
    try {
        const res = await fetch('/redirect_to_notes');
        const data = await res.json();
        const noteName = "{{ note }}";

        if (data[noteName]) {
            quill.setContents(data[noteName]);
        }
    } catch (err) {
        console.error("Failed to load note:", err);
    }
}

async function saveNote() {
    try {
        await fetch('/updateNote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(quill.getContents())
        });

        alert("Saved!");
    } catch (err) {
        console.error("Failed to save:", err);
    }
}

async function generateQuiz() {
    try {
        const res = await fetch('/aiBot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(quill.getText())
        });

        const text = await res.json();
        renderQuiz(text);

    } catch (err) {
        console.error("Failed to generate quiz:", err);
    }
}

function renderQuiz(text) {
    const container = document.getElementById("quizContents");
    container.innerHTML = "";

    if (!text) return;

    // Extract title
    const titleMatch = text.match(/###(.*?)###/);
    if (titleMatch) {
        const h2 = document.createElement("h2");
        h2.textContent = titleMatch[1];
        container.appendChild(h2);
    }

    // Extract questions
    const questionRegex = /\*\*(.*?)\*\*/g;
    const choiceRegex = /~~([a-d])~~([01])(.*?)(?=(~~[a-d]~~[01]|\*\*|\$\$\$))/gs;

    let questions = [...text.matchAll(questionRegex)];

    questions.forEach((qMatch, index) => {
        const qText = qMatch[1];

        const qHeader = document.createElement("h3");
        qHeader.textContent = qText;
        container.appendChild(qHeader);

        let choicesStart = qMatch.index + qMatch[0].length;
        let nextQuestionIndex = (questions[index+1]) ? questions[index+1].index : text.length;
        let choicesBlock = text.slice(choicesStart, nextQuestionIndex);

        let choices = [...choicesBlock.matchAll(choiceRegex)];

        choices.forEach(choice => {
            const letter = choice[1];
            const correct = choice[2] === "1";
            const label = choice[3].trim();

            const btn = document.createElement("button");
            btn.className = "quizAnswerChoice";
            btn.textContent = `${letter.toUpperCase()}: ${label}`;

            btn.onclick = () => {
                btn.classList.add(correct ? "correct" : "incorrect");
            };

            container.appendChild(btn);
        });
    });
}

</script>
</body>
</html>
