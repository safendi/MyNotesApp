<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Classes</title>

    <link href="https://fonts.googleapis.com/css2?family=Nerko+One&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Nerko One", cursive;
            background: linear-gradient(135deg, #2f2f2f, #1e1e1e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            background: #3a3a3a;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 36px;
        }

        button {
            background-color: cornflowerblue;
            border: none;
            border-radius: 25px;
            padding: 10px 18px;
            margin: 6px 0;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s ease-in-out;
        }

        button:hover {
            background-color: white;
            color: black;
            transform: translateY(-2px);
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            border: none;
            margin-bottom: 10px;
            text-align: center;
            font-size: 15px;
        }

        .hidden {
            display: none;
        }

        #currentClasses {
            margin-top: 25px;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

<body>

<div class="container">
    <h1>Your Classes</h1>

    <button id="addClassButton">+ Add Class</button>

    <div id="classAdder" class="hidden">
        <input type="text" id="classBeingAdded" placeholder="Enter class name">
        <button id="submitClass">Create</button>
    </div>

    <div id="currentClasses"></div>
</div>

<script>

document.addEventListener("DOMContentLoaded", () => {
    loadClasses();

    document.getElementById("addClassButton").addEventListener("click", () => {
        document.getElementById("classAdder").classList.remove("hidden");
        document.getElementById("addClassButton").classList.add("hidden");
    });

    document.getElementById("submitClass").addEventListener("click", createClass);
});

async function loadClasses() {
    try {
        const response = await fetch('/Classes');
        const classes = await response.json();

        const container = document.getElementById("currentClasses");
        container.innerHTML = "";

        classes.forEach(course => {
            const button = document.createElement("button");
            button.textContent = course;
            button.classList.add("fade-in");

            button.addEventListener("click", () => openClass(course));

            container.appendChild(button);
        });

    } catch (err) {
        console.error("Failed to load classes:", err);
    }
}

async function createClass() {
    const input = document.getElementById("classBeingAdded");
    const className = input.value.trim();

    if (!className) {
        alert("Please enter a class name.");
        return;
    }

    try {
        await fetch('/Classes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(className)
        });

        input.value = "";
        document.getElementById("classAdder").classList.add("hidden");
        document.getElementById("addClassButton").classList.remove("hidden");

        loadClasses();

    } catch (err) {
        console.error("Failed to create class:", err);
    }
}

async function openClass(course) {
    try {
        const response = await fetch('/home/classes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(course)
        });

        const className = await response.json();
        window.location.href = '/class/' + className;

    } catch (err) {
        console.error("Failed to open class:", err);
    }
}

</script>

</body>
</html>
