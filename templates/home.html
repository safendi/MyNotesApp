<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Classes</title>

    <link href="https://fonts.googleapis.com/css2?family=Nerko+One&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Nerko One", cursive;
            background: linear-gradient(135deg, #2f2f2f, #1e1e1e);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── Header ── */
        header {
            width: 100%;
            background: #2a2a2a;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            padding: 0 30px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 26px;
            color: cornflowerblue;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }

        .logo:hover {
            opacity: 0.8;
        }

        .logo span {
            color: white;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .header-username {
            font-size: 15px;
            color: #ccc;
        }

        .header-username strong {
            color: white;
        }

        .header-link {
            font-size: 15px;
            color: cornflowerblue;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid transparent;
            transition: 0.2s ease-in-out;
        }

        .header-link:hover {
            border-color: cornflowerblue;
            color: white;
        }

        .header-logout {
            font-size: 15px;
            color: #aaa;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid #555;
            transition: 0.2s ease-in-out;
        }

        .header-logout:hover {
            border-color: #ff7f7f;
            color: #ff7f7f;
        }

        /* ── Main content ── */
        .page {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            background: #3a3a3a;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
            animation: fadeIn 0.4s ease-in;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 36px;
        }

        button {
            background-color: cornflowerblue;
            border: none;
            border-radius: 25px;
            padding: 10px 18px;
            margin: 6px 0;
            font-family: "Nerko One", cursive;
            font-size: 16px;
            color: white;
            cursor: pointer;
            width: 100%;
            transition: 0.2s ease-in-out;
        }

        button:hover {
            background-color: white;
            color: black;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #addClassButton {
            width: 50%;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            border: 2px solid transparent;
            background: #2a2a2a;
            color: white;
            font-family: "Nerko One", cursive;
            margin-bottom: 10px;
            text-align: center;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        input::placeholder {
            color: #777;
        }

        input:focus {
            border-color: cornflowerblue;
            background: #222;
        }

        .hidden {
            display: none;
        }

        #currentClasses {
            margin-top: 25px;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<header>
    <a href="/home" class="logo">Quiz<span>Notes</span></a>

    <div class="header-right">
        <span class="header-username">Hey, <strong id="headerUsername">...</strong></span>
        <a href="/home" class="header-link">Home</a>
        <a href="/logout" class="header-logout">Log out</a>
    </div>
</header>

<!-- ── Page ── -->
<div class="page">
    <div class="container">
        <h1>Your Classes</h1>

        <button id="addClassButton">Add Class</button>

        <div id="classAdder" class="hidden">
            <input type="text" id="classBeingAdded" placeholder="Enter class name">
            <button id="submitClass">Create</button>
        </div>

        <div id="currentClasses"></div>
    </div>
</div>

<script>

document.addEventListener("DOMContentLoaded", () => {
    loadUser();
    loadClasses();

    document.getElementById("addClassButton").addEventListener("click", () => {
        document.getElementById("classAdder").classList.remove("hidden");
        document.getElementById("addClassButton").classList.add("hidden");
        document.getElementById("classBeingAdded").focus();
    });

    document.getElementById("submitClass").addEventListener("click", createClass);

    document.getElementById("classBeingAdded").addEventListener("keydown", (e) => {
        if (e.key === "Enter") createClass();
    });
});

async function loadUser() {
    try {
        const response = await fetch('/getUser');
        const data = await response.json();
        document.getElementById("headerUsername").textContent = data;
    } catch (err) {
        console.error("Failed to load user:", err);
    }
}

async function loadClasses() {
    try {
        const response = await fetch('/Classes');
        const classes = await response.json();

        const container = document.getElementById("currentClasses");
        container.innerHTML = "";

        classes.forEach(course => {
            const button = document.createElement("button");
            button.textContent = course;
            button.classList.add("fade-in");
            button.addEventListener("click", () => openClass(course));
            container.appendChild(button);
        });

    } catch (err) {
        console.error("Failed to load classes:", err);
    }
}

async function createClass() {
    const input = document.getElementById("classBeingAdded");
    const className = input.value.trim();

    if (!className) {
        alert("Please enter a class name.");
        return;
    }

    try {
        await fetch('/Classes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(className)
        });

        input.value = "";
        document.getElementById("classAdder").classList.add("hidden");
        document.getElementById("addClassButton").classList.remove("hidden");

        loadClasses();

    } catch (err) {
        console.error("Failed to create class:", err);
    }
}

async function openClass(course) {
    try {
        const response = await fetch('/home/classes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(course)
        });

        const className = await response.json();
        window.location.href = '/class/' + className;

    } catch (err) {
        console.error("Failed to open class:", err);
    }
}

</script>

</body>
</html>
