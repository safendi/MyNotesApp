<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Classes</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Nerko+One&display=swap" rel="stylesheet">

    <style>
        body {
            background: #2f2f2f;
            font-family: "Nerko One", cursive;
            color: white;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        button {
            background-color: cornflowerblue;
            border-radius: 25px;
            font-size: 16px;
            padding: 8px 18px;
            border: none;
            cursor: pointer;
            margin: 6px;
            transition: 0.2s ease-in-out;
        }

        button:hover {
            background-color: white;
            color: black;
            transform: scale(1.05);
        }

        input {
            padding: 8px;
            border-radius: 20px;
            border: none;
            width: 200px;
            text-align: center;
        }

        #classAdder {
            margin-top: 15px;
        }

        #currentClasses {
            margin-top: 40px;
        }

        .class-button {
            display: block;
            width: 100%;
        }

    </style>
</head>

<body onload="loadClasses()">

<div class="container">
    <h1>Your Classes</h1>

    <button onclick="showClassAdder()" id="addClassButton">+ Add Class</button>

    <div id="classAdder" hidden>
        <input type="text" id="classBeingAdded" placeholder="Enter class name">
        <button onclick="classAdded()">Submit</button>
    </div>

    <div id="currentClasses"></div>
</div>

<script>

    function loadClasses() {
        $.ajax({
            url: '/Classes',
            type: 'GET',
            success: function(response) {
                let classes = typeof response === "string" ? JSON.parse(response) : response;

                let classesDiv = document.getElementById("currentClasses");
                classesDiv.innerHTML = "";

                classes.forEach(course => {
                    let button = document.createElement("button");
                    button.innerText = course;
                    button.className = "class-button";

                    button.onclick = function() {
                        $.ajax({
                            url: '/home/classes',
                            type: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify(course),
                            success: function(response) {
                                let className = typeof response === "string" ? JSON.parse(response) : response;
                                window.location.href = '/class/' + className;
                            }
                        });
                    };

                    classesDiv.appendChild(button);
                });
            },
            error: function(error) {
                console.error("Error loading classes:", error);
            }
        });
    }

    function showClassAdder() {
        document.getElementById("classAdder").hidden = false;
        document.getElementById("addClassButton").hidden = true;
    }

    function classAdded() {
        let className = document.getElementById("classBeingAdded").value.trim();

        if (!className) {
            alert("Please enter a class name.");
            return;
        }

        $.ajax({
            url: '/Classes',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(className),
            success: function(response) {
                loadClasses(); // reload dynamically
                document.getElementById("classBeingAdded").value = "";
                document.getElementById("classAdder").hidden = true;
                document.getElementById("addClassButton").hidden = false;
            },
            error: function(error) {
                console.error("Error adding class:", error);
            }
        });
    }

</script>

</body>
</html>
