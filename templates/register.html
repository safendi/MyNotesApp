<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Nerko+One&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Nerko One", cursive;
            background: linear-gradient(135deg, #2f2f2f, #1e1e1e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            background: #3a3a3a;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
            animation: fadeIn 0.4s ease-in;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 36px;
        }

        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 15px;
            margin-bottom: 5px;
            padding-left: 8px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 20px;
            border: 2px solid transparent;
            background: #2a2a2a;
            color: white;
            font-family: "Nerko One", cursive;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        input::placeholder {
            color: #777;
        }

        input:focus {
            border-color: cornflowerblue;
            background: #222;
        }

        input.error {
            border-color: #ff7f7f;
        }

        button {
            background-color: cornflowerblue;
            border: none;
            border-radius: 25px;
            padding: 12px 18px;
            margin-top: 10px;
            font-family: "Nerko One", cursive;
            font-size: 16px;
            color: white;
            cursor: pointer;
            width: 100%;
            transition: 0.2s ease-in-out;
        }

        button:hover {
            background-color: white;
            color: black;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0px);
        }

        #message {
            margin-top: 14px;
            font-size: 14px;
            color: #ff7f7f;
            min-height: 20px;
        }

        #message.success {
            color: #7fbf7f;
        }

        .divider {
            margin: 20px 0 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #555;
        }

        .login-link {
            font-size: 14px;
            color: #aaa;
        }

        .login-link a {
            color: cornflowerblue;
            text-decoration: none;
            transition: color 0.2s;
        }

        .login-link a:hover {
            color: white;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Create Account</h1>

    <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username">
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Choose a password">
    </div>

    <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password">
    </div>

    <button onclick="registerUser()">Register</button>

    <p id="message"></p>

    <div class="divider">or</div>

    <p class="login-link">Already have an account? <a href="/login">Log in</a></p>
</div>

<script>
    document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") registerUser();
    });

    async function registerUser() {
        const username        = document.getElementById("username");
        const password        = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const message         = document.getElementById("message");

        [username, password, confirmPassword].forEach(el => el.classList.remove("error"));
        message.className = "";
        message.innerText = "";

        if (!username.value.trim()) {
            message.innerText = "Please enter a username.";
            username.classList.add("error");
            return;
        }

        if (!password.value) {
            message.innerText = "Please enter a password.";
            password.classList.add("error");
            return;
        }

        if (password.value !== confirmPassword.value) {
            message.innerText = "Passwords don't match.";
            password.classList.add("error");
            confirmPassword.classList.add("error");
            return;
        }

        try {
            const res = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: username.value.trim(), password: password.value })
            });

            const data = await res.json();

            if (res.ok) {
                window.location.href = "/home";
            } else {
                message.innerText = data.error || "Registration failed. Please try again.";
            }
        } catch (err) {
            message.innerText = "Something went wrong. Please try again.";
            console.error("Register error:", err);
        }
    }
</script>

</body>
</html>
