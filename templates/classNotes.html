<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ className }}</title>

<link href="https://fonts.googleapis.com/css2?family=Nerko+One&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: "Nerko One", cursive;
    background: linear-gradient(135deg, #2f2f2f, #1e1e1e);
    color: white;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
}

.container {
    width: 100%;
    max-width: 600px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

button {
    cursor: pointer;
    background-color: cornflowerblue;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    margin: 6px 0;
    transition: 0.2s ease;
}

button:hover {
    background-color: white;
    color: black;
}

.note-button {
    display: block;
    width: 100%;
    margin-top: 8px;
}

.section {
    margin-top: 30px;
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal {
    background: #3a3a3a;
    padding: 25px;
    border-radius: 15px;
    width: 300px;
    text-align: center;
}

input {
    width: 100%;
    padding: 8px;
    border-radius: 15px;
    border: none;
    margin-bottom: 10px;
    text-align: center;
}

.hidden {
    display: none;
}

</style>
</head>

<body>
<div class="container">

<div class="header">
    <h1>{{ className }}</h1>
    <button onclick="goBack()" style="background-color: darkred;">← Back</button>
</div>

<div class="section">
    <button onclick="openModal()" style="background-color: darkolivegreen;">+ New Note</button>
    <p><i>ex: Day 1, Lesson 1, Photosynthesis</i></p>
</div>

<div class="section">
    <h3>My Notes</h3>
    <h2 id="noNotes" class="hidden">No notes currently</h2>
    <div id="notesList"></div>
</div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3>Name Your Note</h3>
        <input type="text" id="newNoteName" placeholder="Enter note name">
        <button onclick="createNote()">Create</button>
        <button onclick="closeModal()" style="background-color: darkred;">Cancel</button>
    </div>
</div>

<script>

document.addEventListener("DOMContentLoaded", loadClassData);

function goBack() {
    window.location.href = "/home";
}

async function loadClassData() {
    try {
        const res = await fetch('/home/classes');
        const data = await res.json();

        const noNotes = document.getElementById("noNotes");
        const list = document.getElementById("notesList");
        list.innerHTML = "";

        if (!data || data === "0" || Object.keys(data).length === 0) {
            noNotes.classList.remove("hidden");
            return;
        }

        noNotes.classList.add("hidden");

        Object.keys(data).forEach(note => {
            const btn = document.createElement("button");
            btn.textContent = note;
            btn.className = "note-button";

            btn.addEventListener("click", () => openNote(note));

            list.appendChild(btn);
        });

    } catch (err) {
        console.error("Failed to load notes:", err);
    }
}

async function openNote(note) {
    try {
        const res = await fetch('/redirect_to_notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(note)
        });

        const route = await res.json();
        window.location.href = route;

    } catch (err) {
        console.error("Failed to open note:", err);
    }
}

function openModal() {
    document.getElementById("modalOverlay").style.display = "flex";
}

function closeModal() {
    document.getElementById("modalOverlay").style.display = "none";
    document.getElementById("newNoteName").value = "";
}

async function createNote() {
    const name = document.getElementById("newNoteName").value.trim();

    if (!name) {
        alert("Please enter a note name.");
        return;
    }

    try {
        await fetch('/notesAPI', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(name)
        });

        closeModal();
        loadClassData(); // Refresh without reload

    } catch (err) {
        console.error("Failed to create note:", err);
    }
}

</script>
</body>
</html>
